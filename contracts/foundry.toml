[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

# The vector test reads the file the Python suite generates.
fs_permissions = [{ access = "read", path = "./test/vectors.json" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.default.fuzz]
runs = 512
